name: Build LiquidBounce

on:
  push:
    branches: [ nextgen ]
  pull_request:
    branches: [ nextgen ]
  workflow_dispatch:

jobs:
  extract-versions:
    runs-on: ubuntu-latest
    outputs:
      lb_version: ${{ steps.versions.outputs.lb_version }}
      jdk_version: ${{ steps.versions.outputs.jdk_version }}
      minecraft_version: ${{ steps.versions.outputs.minecraft_version }}
      loader_version: ${{ steps.versions.outputs.loader_version }}
      fabricapi_version: ${{ steps.versions.outputs.fabricapi_version }}
      kotlin_version: ${{ steps.versions.outputs.kotlin_version }}
      fabric_kotlin_version: ${{ steps.versions.outputs.fabric_kotlin_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract versions
        id: versions
        run: |
          set -euo pipefail

          function gradleprop {
            local key="$1"
            local value=$(grep "^${key}=" gradle.properties | head -n1 | cut -d'=' -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -z "$value" ]; then
              echo "[ERROR] gradleprop: '${key}' not found or blank in gradle.properties" >&2
              exit 1
            fi
            echo "$value"
          }

          function tomlprop {
            local key="$1"
            local value=$(grep "^${key}[[:space:]]*=" gradle/libs.versions.toml | head -n1 | sed -n 's/^[^=]*=[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ -z "$value" ]; then
              echo "[ERROR] tomlprop: '${key}' not found or blank in gradle/libs.versions.toml" >&2
              exit 1
            fi
            echo "$value"
          }

          LB_VERSION=$(gradleprop 'mod_version')
          JDK_VERSION=$(tomlprop 'jdk')
          MINECRAFT_VERSION=$(tomlprop 'minecraft')
          LOADER_VERSION=$(tomlprop 'fabric-loader')
          FABRICAPI_VERSION=$(tomlprop 'fabric-api')
          KOTLIN_VERSION=$(tomlprop 'kotlin')
          FABRIC_KOTLIN_VERSION=$(tomlprop 'fabric-kotlin')

          echo "lb_version=$LB_VERSION" >> "$GITHUB_OUTPUT"
          echo "jdk_version=$JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "loader_version=$LOADER_VERSION" >> "$GITHUB_OUTPUT"
          echo "fabricapi_version=$FABRICAPI_VERSION" >> "$GITHUB_OUTPUT"
          echo "kotlin_version=$KOTLIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=$FABRIC_KOTLIN_VERSION" >> "$GITHUB_OUTPUT"

          echo "LiquidBounce: $LB_VERSION"
          echo "JDK: $JDK_VERSION"
          echo "Minecraft: $MINECRAFT_VERSION"
          echo "Fabric Loader: $LOADER_VERSION"
          echo "Fabric API: $FABRICAPI_VERSION"
          echo "Kotlin: $KOTLIN_VERSION"
          echo "Fabric Kotlin: $FABRIC_KOTLIN_VERSION"

  build:
    runs-on: ubuntu-latest
    needs: extract-versions
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Setting up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ needs.extract-versions.outputs.jdk_version }}

      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/nextgen' }}

      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt

      - name: Prepare artifacts
        env:
          LB_VERSION: ${{ needs.extract-versions.outputs.lb_version }}
          MINECRAFT_VERSION: ${{ needs.extract-versions.outputs.minecraft_version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "=== Build artifacts in build/libs ==="
          ls -lh build/libs/

          # Copy the main JAR (without sources/dev classifiers) to a known name
          cd build/libs
          JAR=$(find . -regex '.*liquidbounce-[0-9.]*\.jar' | head -n1)

          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            exit 1
          fi

          echo "Found JAR: $JAR"

          # Make a release-friendly zip with metadata
          mkdir -p artifact
          cp "$JAR" artifact/liquidbounce.jar

          # Add a small README with build info
          cat > artifact/BUILD_INFO.txt <<EOF
          LiquidBounce Build Info
          =======================
          Version: $LB_VERSION
          Minecraft: $MINECRAFT_VERSION
          Commit: $COMMIT_SHA
          Branch: ${{ github.ref_name }}
          Build Date: $(date -u)
          Built by: GitHub Actions
          EOF

          cd artifact
          zip -r liquidbounce-"$LB_VERSION"-"$MINECRAFT_VERSION"-"${COMMIT_SHA::7}".zip *
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce-build-${{ needs.extract-versions.outputs.lb_version }}-${{ github.sha }}
          path: build/libs/artifact/*
          retention-days: 30
          compression-level: 0

      - name: Upload JAR directly
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce-${{ needs.extract-versions.outputs.lb_version }}-jar
          path: build/libs/*liquidbounce-*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release on push to nextgen
        if: github.event_name == 'push' && github.ref == 'refs/heads/nextgen'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.sha }}
          name: Nightly Build ${{ needs.extract-versions.outputs.lb_version }} (${{ github.sha }})
          body: |
            ## LiquidBounce Nightly Build

            **Version:** ${{ needs.extract-versions.outputs.lb_version }}
            **Minecraft:** ${{ needs.extract-versions.outputs.minecraft_version }}
            **Commit:** ${{ github.sha }}

            ### Boosted KillAura Features
            - MaxPower mode (default ON) - bypasses critical hit & inventory checks
            - AggressiveTiming - 2x faster attacks
            - Doubled default range (3-6 blocks)
            - Through-walls attacking enabled
            - MaxCpsBoost - bypass cooldowns when target exists
            - IgnoreOnHurtTime - chain attacks during hurt animation

            ### Files
            - `liquidbounce.jar` - Main mod JAR (put in mods folder)
            - `BUILD_INFO.txt` - Build metadata

            Built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: |
            build/libs/artifact/liquidbounce.jar
            build/libs/artifact/BUILD_INFO.txt
          prerelease: true
          draft: false

      - name: Build summary
        env:
          LB_VERSION: ${{ needs.extract-versions.outputs.lb_version }}
          MINECRAFT_VERSION: ${{ needs.extract-versions.outputs.minecraft_version }}
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| LiquidBounce | \`$LB_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Minecraft | \`$MINECRAFT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful! Artifacts uploaded." >> $GITHUB_STEP_SUMMARY

  build-installer:
    needs: [extract-versions, build]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    env:
      LB_VERSION: ${{ needs.extract-versions.outputs.lb_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: liquidbounce-${{ needs.extract-versions.outputs.lb_version }}-jar
          path: installer/

      - name: Rename JAR for installer
        shell: pwsh
        run: |
          Write-Host "=== Files in installer/ ==="
          Get-ChildItem installer/
          $jar = Get-ChildItem installer/ -Filter "liquidbounce-*.jar" | Select-Object -First 1
          if (-not $jar) { throw "No JAR found in installer/" }
          Write-Host "Found: $($jar.Name)"
          Rename-Item $jar.FullName "liquidbounce-boosted.jar"
          Write-Host "=== After rename ==="
          Get-ChildItem installer/

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --limit-output
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup install failed"
          }
          Write-Host "Inno Setup installed at: C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Compile installer EXE
        shell: pwsh
        run: |
          cd installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "liquidbounce-installer.iss" /Q
          if (-not (Test-Path "Output\LiquidBounce-Boosted-Installer.exe")) {
            throw "Installer EXE was not created"
          }
          Write-Host "=== Installer EXE created ==="
          Get-ChildItem Output/
          (Get-Item "Output\LiquidBounce-Boosted-Installer.exe").Length / 1MB | ForEach-Object { "Size: {0:N2} MB" -f $_ }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBounce-Boosted-Installer-${{ github.sha }}
          path: installer/Output/LiquidBounce-Boosted-Installer.exe
          retention-days: 90

      - name: Add installer to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/nextgen'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.sha }}
          files: installer/Output/LiquidBounce-Boosted-Installer.exe

      - name: Installer summary
        shell: pwsh
        run: |
          $size = (Get-Item "installer/Output/LiquidBounce-Boosted-Installer.exe").Length / 1MB
          echo "### Windows Installer Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Installer | \`LiquidBounce-Boosted-Installer.exe\` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Size | $("{0:N2}" -f $size) MB |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Built with | Inno Setup 6 |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "## Installer Features" >> $env:GITHUB_STEP_SUMMARY
          echo "- Auto-detects mods folder (LiquidLauncher or default .minecraft)" >> $env:GITHUB_STEP_SUMMARY
          echo "- Backs up existing LiquidBounce.jar" >> $env:GITHUB_STEP_SUMMARY
          echo "- Installs boosted JAR as LiquidBounce.jar" >> $env:GITHUB_STEP_SUMMARY
          echo "- Creates desktop shortcut 'Refresh' to re-apply if launcher overwrites" >> $env:GITHUB_STEP_SUMMARY
          echo "- Creates desktop shortcut 'Restore Official' to revert" >> $env:GITHUB_STEP_SUMMARY
          echo "- Includes uninstaller" >> $env:GITHUB_STEP_SUMMARY
